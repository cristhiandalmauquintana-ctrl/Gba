<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Retro OS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="bar"><span>Retro OS</span><span id="clock"></span></header>
    <main id="icons" class="icons"></main>
    <footer class="legal">
      <p>Este proyecto no incluye ROMs comerciales. La tienda solo ofrece juegos de libre distribución, con su licencia y fuente visibles.</p>
    </footer>

    <section id="win" class="win" hidden>
      <div class="win-bar">
        <strong id="win-title"></strong>
        <button id="win-close" type="button" aria-label="Cerrar">✕</button>
      </div>
      <div id="win-body" class="win-body"></div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
