<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0c1c" />
    <title>Retro OS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand"><span class="logo"></span>Retro OS</span>
      <span class="status"><span id="date"></span><span id="clock"></span></span>
    </header>

    <main id="icons" class="icons"></main>

    <p class="legal">Este proyecto no incluye ROMs comerciales. La tienda solo ofrece juegos de libre distribución, con su licencia y fuente visibles.</p>

    <nav id="dock" class="dock" aria-label="Aplicaciones"></nav>

    <section id="win" class="win" hidden role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="win-bar">
        <button id="win-close" class="win-close" type="button" aria-label="Cerrar">✕</button>
        <strong id="win-title"></strong>
        <span></span>
      </div>
      <div id="win-body" class="win-body"></div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
